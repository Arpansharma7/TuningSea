<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>TuningSea Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>
  <div class="app-shell">
    <header class="titlebar">
      <button class="brand" data-route="projects" aria-label="Go to projects">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2.5" y="2.5" width="27" height="27" rx="8"></rect>
          <path class="logo-t" d="M8 9h16M16 9v8"></path>
          <path d="M7 19c3-3 5 3 8 0s5 3 10 0M7 24c3-3 5 3 8 0s5 3 10 0"></path>
        </svg>
        <span>TUNINGSEA</span><em>STUDIO</em>
      </button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path></svg>
        <span id="theme-label">Light theme</span>
      </button>
      <div class="clock-wrap"><span>Local time</span><strong class="clock" id="clock">00:00:00</strong></div>
    </header>

    <div class="workspace">
      <nav class="sidebar" aria-label="Primary navigation">
        <button class="nav-item active" data-route="projects" aria-label="Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2-2h9v14H3z"></path><path d="M3 9.5h18"></path></svg><span>Projects</span></button>
        <button class="nav-item" data-route="data" aria-label="Data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg><span>Data</span></button>
        <button class="nav-item" data-route="models" aria-label="Models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9z"></path><path d="m4 6.5 8 4.5 8-4.5M12 11v9"></path></svg><span>Models</span></button>
        <button class="nav-item" data-route="runs" aria-label="Runs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"></path></svg><span>Runs</span></button>
        <button class="nav-item" data-route="evaluation" aria-label="Evaluation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span>Evaluation</span></button>
        <button class="nav-item" data-route="library" aria-label="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4z"></path><path d="M20 4h-4a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h4z"></path></svg><span>Library</span></button>
        <button class="nav-item nav-bottom" data-route="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1v.1h-4v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1-.4h-.1v-4H3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1v-.1h4V3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.36.7.65.96.29.26.66.4 1.05.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.64Z"></path></svg><span>Settings</span></button>
      </nav>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modal-content"></form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="desktop-renderer.js"></script>
</body>
</html>
